<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="calculator-card">
        <h1>BMI Calculator</h1>

        <form id="bmi-form" novalidate>
          <div class="input-group">
            <label for="weight">Weight (kg)</label>
            <input id="weight" name="weight" type="number" min="1" step="0.1" placeholder="e.g. 65" required />
          </div>

          <div class="input-group">
            <label for="height">Height (cm)</label>
            <input id="height" name="height" type="number" min="1" step="0.1" placeholder="e.g. 170" required />
          </div>

          <div class="button-row">
            <button type="submit" class="primary-btn">Calculate BMI</button>
            <button type="button" id="reset-btn" class="secondary-btn">Reset</button>
          </div>
        </form>

        <p id="error" class="error-message" aria-live="polite"></p>

        <div class="result-box" aria-live="polite">
          <p id="bmi-result">Your BMI: </p>
          <p id="bmi-category">Category: </p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
